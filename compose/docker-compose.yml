# truefisical — canonical Infisical stack.
# Same compose serves two install paths:
#   - workstation dev:  docker compose -f compose/docker-compose.yml --env-file .env up -d
#   - TrueNAS Custom App: paste this file + set env vars in the TrueNAS UI
# Env values are passed via compose interpolation (${VAR}) so neither path needs
# a baked-in env_file path. See docs/install/ for the per-path instructions.

services:
  backend:
    image: infisical/infisical:v0.159.19
    restart: unless-stopped
    pull_policy: always
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: ${DB_CONNECTION_URI:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SITE_URL: ${SITE_URL}
      LICENSE_KEY: ${LICENSE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      CLIENT_ID_GOOGLE_LOGIN: ${CLIENT_ID_GOOGLE_LOGIN:-}
      CLIENT_SECRET_GOOGLE_LOGIN: ${CLIENT_SECRET_GOOGLE_LOGIN:-}
      CLIENT_ID_GITHUB_LOGIN: ${CLIENT_ID_GITHUB_LOGIN:-}
      CLIENT_SECRET_GITHUB_LOGIN: ${CLIENT_SECRET_GITHUB_LOGIN:-}
      CLIENT_ID_GITLAB_LOGIN: ${CLIENT_ID_GITLAB_LOGIN:-}
      CLIENT_SECRET_GITLAB_LOGIN: ${CLIENT_SECRET_GITLAB_LOGIN:-}
      OTEL_TELEMETRY_COLLECTION_ENABLED: ${OTEL_TELEMETRY_COLLECTION_ENABLED:-false}
      OTEL_EXPORT_TYPE: ${OTEL_EXPORT_TYPE:-prometheus}
      OTEL_EXPORT_OTLP_ENDPOINT: ${OTEL_EXPORT_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${TRUEFISICAL_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - truefisical

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - truefisical

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - truefisical

volumes:
  pg_data:
  redis_data:

networks:
  truefisical:
